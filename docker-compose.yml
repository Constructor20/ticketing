services:
  php:
    build: .
    container_name: ticketing-app
    restart: unless-stopped
    working_dir: /var/www/html/src
    volumes:
      # Tout le dossier ticketing/ dans /var/www/html, Apache sert src/ (voir dockerfile)
      - ./:/var/www/html
      # Volume anonyme : garde le vendor reconstruit dans l'image (Linux).
      # Sans lui, le mount ci-dessus écraserait /var/www/html/vendor.
      - /var/www/html/vendor
      - ./.env:/var/www/html/.env:ro
    ports:
      - "8081:80"

  db:
    image: mariadb:11.4
    container_name: ticketing-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  adminer:
    image: adminer:5.3.0
    container_name: ticketing-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db-data: